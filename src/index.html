<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar na organização</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<main class="container">

    <section class="card">

        <div class="header">

            <div class="github-icon">
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        fill="currentColor"
                        d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.72-1.53-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.73 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.77 1.04.77 2.1v3.11c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
                    />
                </svg>
            </div>

            <h1>Entre na organização</h1>

            <p>
                Informe seu usuário do GitHub para solicitar acesso.
            </p>

        </div>

        <form id="invite-form">

            <label for="github-username">
                GitHub username
            </label>

            <div class="input-wrapper">
                <span>@</span>

                <input
                    id="github-username"
                    name="github_username"
                    type="text"
                    placeholder="seu-usuario"
                    autocomplete="off"
                    required
                    maxlength="39"
                >
            </div>

            <p class="help">
                Digite exatamente seu username do GitHub.
            </p>

            <button
                id="submit-button"
                type="submit"
            >
                Solicitar acesso
            </button>

        </form>

        <div
            id="message"
            class="message hidden"
            role="alert"
        ></div>

    </section>

</main>

<script src="./app.js"></script>

</body>
</html>
